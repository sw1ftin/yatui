[package]
name = "yatui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
percent-encoding = "2.3.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["blocking", "json", "form", "rustls", "query"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
